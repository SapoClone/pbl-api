name: Build & run test
on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
      - '!**/README*.md'
      - '!docs/**'
  pull_request:
    branches: [ 'main' ]
    types: [opened, synchronize]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
      - '!**/README*.md'
      - '!docs/**'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    timeout-minutes: 15
    # skip ci if PR has label 'skip-ci' or 'skip-actions'
    if: |
      !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-actions')
    runs-on: ubuntu-latest
    steps:
      - name: Copy repository
        uses: actions/checkout@v4
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint:check

  service:
    # one independent job per service: a failure in one does not cancel the others
    name: ${{ matrix.service }} (build and test)
    timeout-minutes: 15
    if: |
      !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-actions')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # libs = shared Nest libraries under libs/ (build:libs type-checks, test:libs runs their specs)
        service: [platform, catalog, finance, integration, insight, inventory, sales, customer, libs]
    steps:
      - name: Copy repository
        uses: actions/checkout@v4
        with:
          # libs compares its public exports with origin/main (needs history)
          fetch-depth: ${{ matrix.service == 'libs' && 0 || 1 }}
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.service }}
        run: pnpm build:${{ matrix.service }}

      - name: Run UT tests for ${{ matrix.service }}
        run: pnpm test:${{ matrix.service }}

      - name: Test the release scripts (libs)
        if: matrix.service == 'libs'
        run: pnpm test:scripts

      - name: Check shared-library versions against main (libs, PRs)
        # a removed or renamed export needs a major bump (ADR-0009)
        if: matrix.service == 'libs' && github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/check-lib-version.mjs --pr --base origin/main

  docs:
    name: Build docs
    timeout-minutes: 15
    if: |
      !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-actions')
    runs-on: ubuntu-latest
    steps:
      - name: Copy repository
        uses: actions/checkout@v4
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

  events-integration:
    # the event bus, sales and insight against a real Postgres and a real SQS (ADR-0007); ElasticMQ is
    # the same stand-in docker-compose uses, its default node address is localhost
    name: Integration (event bus, sales, insight)
    timeout-minutes: 15
    if: |
      !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-actions')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pbl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pbl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      elasticmq:
        image: softwaremill/elasticmq-native:latest
        ports:
          - 9324:9324
    env:
      EVENTS_IT_DB_PORT: '5432'
      AWS_ENDPOINT_URL_SQS: http://localhost:9324
    steps:
      - name: Copy repository
        uses: actions/checkout@v4
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:int
