  }
  integration-events-dlq {
    defaultVisibilityTimeout = 60 seconds
  }
  integration-events {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "integration-events-dlq"
      maxReceiveCount = 5
