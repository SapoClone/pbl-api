# Local stand-in for AWS SQS (docker compose only). Mirrors the
# "email-verification" queue that pbl-infra creates in AWS.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  email-verification {
    defaultVisibilityTimeout = 60 seconds
  }
  catalog-events-dlq {
    defaultVisibilityTimeout = 60 seconds
  }
  catalog-events {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "catalog-events-dlq"
      maxReceiveCount = 5
    }
  }
  inventory-events-dlq {
    defaultVisibilityTimeout = 60 seconds
  }
  inventory-events {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "inventory-events-dlq"
      maxReceiveCount = 5
    }
  }
  sales-events-dlq {
    defaultVisibilityTimeout = 60 seconds
  }
  sales-events {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "sales-events-dlq"
      maxReceiveCount = 5
    }
  }
  customer-events-dlq {
    defaultVisibilityTimeout = 60 seconds
  }
  customer-events {
