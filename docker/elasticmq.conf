# Local stand-in for AWS SQS (docker compose only). Mirrors the
# "email-verification" queue that pbl-infra creates in AWS.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  email-verification {
    defaultVisibilityTimeout = 60 seconds
  }
}
