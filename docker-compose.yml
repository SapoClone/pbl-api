services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: platform
    command: ["sh", "-c", "pnpm start:dev"]
    env_file:
      - .env.docker.platform
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - pbl-network

  catalog:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: catalog
    environment:
      PORT: "3000"
    networks:
      - pbl-network

  commerce:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: commerce
    environment:
      PORT: "3000"
    networks:
      - pbl-network

  finance:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: finance
    environment:
      PORT: "3000"
    networks:
      - pbl-network

  integration:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: integration
    environment:
      PORT: "3000"
    networks:
      - pbl-network

  insight:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: insight
    environment:
      PORT: "3000"
    networks:
      - pbl-network

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: pbl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: "UTC"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    ports:
      - "25432:5432"
    networks:
      - pbl-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - pbl-network

  krakend:
    image: devopsfaith/krakend:2.6
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json:ro
    ports:
      - "8080:8080"
    depends_on:
      - platform
      - catalog
      - commerce
      - finance
      - integration
      - insight
    networks:
      - pbl-network

networks:
  pbl-network:
    driver: bridge

volumes:
  postgres_data:
