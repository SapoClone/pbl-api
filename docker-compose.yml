# Host ports can be overridden without editing this file, e.g.
#   REDIS_HOST_PORT=6380 GATEWAY_HOST_PORT=8081 docker compose up --build -d
# (PLATFORM_HOST_PORT, POSTGRES_HOST_PORT, REDIS_HOST_PORT, ELASTICMQ_HOST_PORT,
# GATEWAY_HOST_PORT). Containers talk to each other on the internal network,
# so only what you reach from the host changes.
services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: platform
    command: ["sh", "-c", "pnpm start:dev"]
    env_file:
      - .env.docker.platform
    ports:
      - "${PLATFORM_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      elasticmq:
        condition: service_started
    networks:
      - pbl-network

  catalog:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: catalog
    environment:
      PORT: "3000"
      AUTH_JWKS_URL: http://platform:3000/.well-known/jwks.json
    networks:
      - pbl-network

  commerce:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: commerce
    environment:
      PORT: "3000"
      AUTH_JWKS_URL: http://platform:3000/.well-known/jwks.json
    networks:
      - pbl-network

  finance:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: finance
    environment:
      PORT: "3000"
      AUTH_JWKS_URL: http://platform:3000/.well-known/jwks.json
    networks:
      - pbl-network

  integration:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: integration
    environment:
      PORT: "3000"
      AUTH_JWKS_URL: http://platform:3000/.well-known/jwks.json
    networks:
      - pbl-network

  insight:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: insight
    environment:
      PORT: "3000"
      AUTH_JWKS_URL: http://platform:3000/.well-known/jwks.json
    networks:
      - pbl-network

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: pbl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: "UTC"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d pbl" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pbl_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    ports:
      - "${POSTGRES_HOST_PORT:-25432}:5432"
    networks:
      - pbl-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - pbl-network

  # Local stand-in for AWS SQS (the email-verification queue) — see docker/elasticmq.conf
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    restart: always
    ports:
      - "${ELASTICMQ_HOST_PORT:-9324}:9324"
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro
    networks:
      - pbl-network

  krakend:
    image: devopsfaith/krakend:2.6
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json:ro
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      - platform
      - catalog
      - commerce
      - finance
      - integration
      - insight
    networks:
      - pbl-network

networks:
  pbl-network:
    driver: bridge

volumes:
  # Not "postgres_data": the pre-monorepo compose file (same project name)
  # used that name for a cluster without the "pbl" database. Postgres only
  # runs POSTGRES_DB + docker-entrypoint-initdb.d on an EMPTY volume, so
  # reusing it left platform crash-looping on 'database "pbl" does not exist'.
  pbl_postgres_data:
